{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:720px;margin:0 auto;padding:28px 18px;">
  <h1 style="font-size:28px;font-weight:900;margin:0;">予約（患者）</h1>
  <p style="color:var(--muted);margin-top:6px;">お名前と電話番号を入力してください</p>

  <form method="post" style="margin-top:18px;display:grid;gap:12px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn primary" type="submit">予約へ進む</button>
  </form>
</div>
{% endblock %}
