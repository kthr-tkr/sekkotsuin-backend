{% extends "staff/_layout.html" %}

{% block content %}
<div style="max-width:600px; margin:40px auto;">

  <h2 style="font-size:24px; font-weight:900; margin-bottom:20px;">
    新規患者登録
  </h2>

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <div style="margin-top:20px;">
      <button type="submit" style="
        padding:12px 20px;
        border-radius:10px;
        background:#3b82f6;
        color:#fff;
        font-weight:700;
        border:none;
      ">
        登録する
      </button>
    </div>

  </form>

</div>
{% endblock %}
