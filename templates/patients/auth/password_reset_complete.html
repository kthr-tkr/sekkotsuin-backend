<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>再設定完了</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e5e7eb;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
    .card{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(2,6,23,.06);padding:28px;text-align:center;}
    .title{font-size:22px;font-weight:800;margin:0 0 10px;}
    .text{color:var(--muted);font-size:14px;line-height:1.8;}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:14px;text-decoration:none;font-weight:800;background:linear-gradient(180deg,#112a52,#0b1a33);color:#fff;margin-top:20px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">パスワードを更新しました</h1>
      <div class="text">
        新しいパスワードでログインできます。
      </div>
      <a class="btn" href="{% url 'patients:login' %}">ログイン画面へ戻る</a>
    </div>
  </div>
</body>
</html>
