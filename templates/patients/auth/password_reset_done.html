<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>再設定メール送信完了</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --primary:#0b1a33;
      --primary2:#112a52;
      --success:#16a34a;
      --success-bg:#f0fdf4;
      --success-line:#bbf7d0;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }

    .card{
      width:min(620px, 100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:0 10px 30px rgba(2,6,23,.06);
      padding:36px 30px 28px;
      text-align:center;
    }

    .icon{
      width:72px;
      height:72px;
      margin:0 auto 20px;
      border-radius:999px;
      background:var(--success-bg);
      border:1px solid var(--success-line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      color:var(--success);
      font-weight:900;
    }

    .title{
      font-size:30px;
      font-weight:900;
      margin:0;
      letter-spacing:.01em;
    }

    .subtitle{
      margin:14px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.9;
    }

    .note{
      margin:22px 0 0;
      padding:16px 18px;
      border-radius:16px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      color:#475569;
      font-size:13px;
      line-height:1.8;
      text-align:left;
    }

    .actions{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:24px;
      flex-wrap:wrap;
    }

    .btn{
      min-width:220px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      padding:14px 18px;
      font-weight:800;
      font-size:14px;
      border:1px solid var(--line);
      background:#fff;
      color:#0f172a;
      text-decoration:none;
      cursor:pointer;
    }

    .btn:hover{
      filter:brightness(.98);
    }

    .btn-primary{
      background:linear-gradient(180deg, var(--primary2), var(--primary));
      color:#fff;
      border-color:transparent;
      box-shadow:0 10px 18px rgba(11,26,51,.18);
    }

    @media (max-width: 480px){
      .card{
        padding:28px 20px 22px;
      }

      .title{
        font-size:26px;
      }

      .subtitle{
        font-size:14px;
      }

      .actions{
        flex-direction:column;
      }

      .btn{
        width:100%;
        min-width:0;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">✓</div>

      <h1 class="title">再設定メールを送信しました</h1>

      <p class="subtitle">
        ご登録のメールアドレス宛に、<br>
        パスワード再設定用のご案内を送信しました。
      </p>

      <div class="note">
        ・メールが届かない場合は、迷惑メールフォルダもご確認ください。<br>
        ・メール内のリンクから新しいパスワードを設定できます。<br>
        ・この画面を閉じても問題ありません。
      </div>

      <div class="actions">
        <a class="btn" href="{% url 'patients:login' %}">ログイン画面へ戻る</a>
        <a class="btn btn-primary" href="{% url 'patients:password_reset' %}">別のメールアドレスで再送する</a>
      </div>
    </div>
  </div>
</body>
</html>
