<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}接骨院 予約{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#fff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --brand:#2563eb;
      --brand2:#1d4ed8;
      --shadow: 0 12px 30px rgba(15,23,42,.08);
      --r:18px;
    }
    body{background:var(--bg); color:var(--text);}
    .p-nav{background:#fff;border-bottom:1px solid var(--line);}
    .p-nav .brand{font-weight:900;letter-spacing:.02em;}
    .p-wrap{max-width:1100px;margin:0 auto;padding:24px 18px;}

    .p-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
      padding:10px 14px;border-radius:999px;border:1px solid var(--line);
      background:#fff;color:var(--text);text-decoration:none;font-weight:700;}
    .p-btn:hover{filter:brightness(.98);}
    .p-btn-primary{background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;border:0;}
    .p-btn-ghost{background:#fff;}
    .p-iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);
      display:grid;place-items:center;background:#fff;text-decoration:none;color:var(--text);font-size:20px;font-weight:900;}

    .p-page{}
    .p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;}
    .p-title{font-size:28px;font-weight:900;margin:0;}
    .p-sub{color:var(--muted);margin-top:6px;}

    .p-monthbar{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:14px;}
    .p-month{font-weight:900;font-size:18px;}

    .p-card{margin-top:18px;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r);box-shadow:var(--shadow);padding:18px;}
    .p-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;
      font-weight:900;color:var(--muted);padding:0 6px 10px;}
    .p-weekdays .sun{color:#ef4444;}
    .p-weekdays .sat{color:#2563eb;}

    .p-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
    .p-cell{min-height:92px;border-radius:16px;border:1px solid var(--line);
      background:#fff;padding:12px;text-decoration:none;color:inherit;
      display:flex;flex-direction:column;justify-content:space-between;}
    .p-cell-empty{border:0;background:transparent;}
    .p-cell-disabled{opacity:.45;background:#fafafa;}
    .p-cell-active:hover{border-color:#c7d2fe;box-shadow:0 10px 20px rgba(37,99,235,.10);transform:translateY(-1px);}
    .p-day{font-size:18px;font-weight:900;line-height:1;}
    .p-meta{color:var(--muted);font-weight:800;font-size:13px;}

    .p-footerbar{margin-top:16px;display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;}
    .wizard { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
    .wizard__top { display:flex; justify-content:space-between; color:#6b7280; margin-bottom:10px; }
    .wizard__bar { height: 6px; background:#e5e7eb; border-radius: 999px; overflow:hidden; }
    .wizard__barfill { height:100%; background:#111827; }
    .wizard__card { margin-top: 20px; padding: 36px 28px; border:1px solid #e5e7eb; border-radius: 14px; background:#fff; }
    .wizard__title { font-size: 26px; margin: 0 0 18px; }
    .field { margin: 18px 0; }
    .field__label { display:block; margin-bottom: 8px; color:#374151; }
    .req { color:#ef4444; margin-left:6px; }
    .field__error { color:#ef4444; margin-top:8px; font-size: 13px; }
    .wizard__actions { display:flex; gap:14px; margin-top: 26px; }
    .btn { padding: 12px 18px; border-radius: 12px; border:1px solid #d1d5db; background:#fff; cursor:pointer; }
    .btn--ghost { background:#fff; }
    .btn--primary { flex:1; background:#6b7280; color:#fff; border-color:#6b7280; }
    .profile-grid .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f3f4f6; }
.done-wrapper {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 20px;
}

.done-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 40px;
  border: 1px solid #e5e7eb;
  text-align: center;
}

.done-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 20px;
  background: #10b981;
  color: #ffffff;
  font-size: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.done-title {
  font-size: 24px;
  margin-bottom: 10px;
}

.done-sub {
  color: #6b7280;
  margin-bottom: 30px;
}

.done-reservation,
.done-info {
  text-align: left;
  margin-top: 30px;
}

.done-reservation .row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #f3f4f6;
}

.done-actions {
  display: flex;
  gap: 16px;
  margin-top: 40px;
  justify-content: center;
}

.btn {
  padding: 12px 18px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 600;
}

.btn-outline {
  border: 1px solid #6b7280;
  color: #374151;
}

.btn-primary {
  background: #6b7280;
  color: #ffffff;
}

.p-nav .p-btn{
  min-height: 40px;
  padding: 8px 14px;
  font-size: 14px;
}

.p-nav .brand{
  font-weight: 900;
  letter-spacing: .02em;
}

  </style>
</head>

<body>
  <nav class="p-nav">
    <div class="container py-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
      <a href="{% url 'patients:dashboard' %}" class="brand text-decoration-none text-dark">
        接骨院 予約
      </a>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        {% if user.is_authenticated %}
          <div class="text-secondary small me-2">
            {{ user.username }}
          </div>

          <a href="{% url 'patients:dashboard' %}" class="p-btn p-btn-ghost">
            ホーム
          </a>

          <a href="{% url 'patients:my_appointments' %}" class="p-btn p-btn-ghost">
            予約一覧
          </a>

          <a href="{% url 'patients:logout' %}" class="p-btn p-btn-primary">
            ログアウト
          </a>
        {% endif %}

        {% block nav_right %}{% endblock %}
      </div>
    </div>
  </nav>

  <main class="p-wrap">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mb-2">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
