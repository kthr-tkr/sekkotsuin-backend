<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登録完了</title>

  <style>
    :root{
      --bg:#0b1220;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --primary:#0b1a33;
      --primary2:#112a52;
      --radius:18px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP","Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: radial-gradient(1200px 600px at 50% 20%, rgba(120,94,240,.18), rgba(0,0,0,0)) , var(--bg);
      color: var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }

    .card{
      width:min(820px, 100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow: 0 20px 50px rgba(2,6,23,.35);
      padding:34px 34px 28px;
    }

    /* ★ここが重要：他のCSSに負けないように “完了画面内は必ず濃い文字” に戻す */
    .card, .card *{
      color: var(--text) !important;
    }
    .muted{ color: var(--muted) !important; }

    .title{
      margin:0;
      font-size:28px;
      font-weight:900;
      letter-spacing:.02em;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .subtitle{
      margin:10px 0 0;
      font-size:14px;
      line-height:1.7;
      color: var(--muted) !important;
    }

    .divider{
      height:1px;
      background:var(--line);
      margin:22px 0;
    }

    .no-box{
      background: rgba(15,23,42,.03);
      border: 1px solid rgba(15,23,42,.06);
      border-radius: 18px;
      padding:18px;
    }
    .no-label{
      font-size:12px;
      font-weight:900;
      color: var(--muted) !important;
      letter-spacing:.02em;
    }
    .no-value{
      margin-top:10px;
      font-size:34px;
      font-weight:1000;
      letter-spacing:.06em;
    }

    .actions{
      display:flex;
      gap:12px;
      margin-top:18px;
      flex-wrap:wrap;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      height:44px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:900;
      text-decoration:none;
      cursor:pointer;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px); }

    .btn-primary{
      background: linear-gradient(180deg, var(--primary2), var(--primary));
      color:#fff !important;
      border-color: transparent;
      box-shadow: 0 10px 18px rgba(11,26,51,.25);
    }

    .note{
      margin-top:18px;
      border:1px solid rgba(120,94,240,.18);
      background: rgba(120,94,240,.06);
      border-radius: 18px;
      padding:16px;
    }
    .note-title{
      margin:0 0 10px;
      font-size:13px;
      font-weight:1000;
    }
    .note ul{
      margin:0;
      padding-left:18px;
      line-height:1.8;
      color: var(--muted) !important;
      font-size:13px;
    }

    .small{
      margin-top:14px;
      text-align:center;
      font-size:12px;
      color:#94a3b8 !important;
    }

    @media (max-width:520px){
      .card{ padding:22px 18px 18px; border-radius:22px; }
      .title{ font-size:22px; }
      .no-value{ font-size:28px; }
      .actions{ flex-direction:column; }
      .btn{ width:100%; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">登録が完了しました 🎉</h1>
      <p class="subtitle">
        次回以降のログインに使用します。<strong>診察券番号は必ず控えてください</strong>（スクリーンショット推奨）。
      </p>

      <div class="divider"></div>

      <div class="no-box">
        <div class="no-label">あなたの診察券番号</div>
        <div class="no-value" id="cardNo">{{ card_no }}</div>

        <div class="actions" style="margin-top:14px;">
          <button class="btn" type="button" onclick="copyCardNo()">診察券番号をコピー</button>
        </div>
      </div>

      <div class="note" aria-label="注意事項">
        <p class="note-title">ご注意（大事）</p>
        <ul>
          <li>パスワードは忘れないように保管してください（第三者に教えないでください）。</li>
          <li>当院スタッフがパスワードをお尋ねすることはありません。</li>
          <li>個人情報は適切に管理し、医療目的以外には利用しません。</li>
          <li>不正利用が疑われる場合は、受付までご連絡ください。</li>
        </ul>
      </div>

      <div class="actions" style="margin-top:18px;">
        <a class="btn" href="{% url 'patients:login' %}">ログインへ</a>
        <a class="btn ghost" href="/">トップへ</a>
      </div>

      <div class="small">個人情報は厳重に管理されます</div>
    </div>
  </div>

  <script>
    function copyCardNo(){
      const text = document.getElementById("cardNo").innerText.trim();
      navigator.clipboard.writeText(text).then(()=>{
        alert("診察券番号をコピーしました");
      }).catch(()=>{
        // 古いブラウザ保険
        const range = document.createRange();
        range.selectNode(document.getElementById("cardNo"));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand("copy");
        sel.removeAllRanges();
        alert("診察券番号をコピーしました");
      });
    }
  </script>
</body>
</html>
