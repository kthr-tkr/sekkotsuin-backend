<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>ページを表示できません</title>
  <style>
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;margin:0;place-items:center;padding:24px;color:#17324d;background:#f1f6f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif}
    main{width:min(100%,520px);padding:34px 28px;border:1px solid #dbe7f2;border-radius:22px;text-align:center;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.08)}
    .mark{display:grid;width:54px;height:54px;margin:0 auto 18px;place-items:center;border-radius:18px;color:#2874a6;background:#eaf4fb;font-size:24px;font-weight:900}
    h1{margin:0;font-size:23px;line-height:1.4}
    p{margin:13px 0 0;color:#60758a;font-size:15px;line-height:1.85}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">i</div>
    <h1>ページを表示できません</h1>
    <p>URLの有効期限が切れているか、現在利用できません。必要な場合は院のスタッフへご確認ください。</p>
  </main>
</body>
</html>
