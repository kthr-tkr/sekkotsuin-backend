<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}接骨院システム{% endblock %}</title>

  {# Bootstrap使うなら（CDNで最短） #}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand" href="/visits/">接骨院システム</a>
      <div class="text-secondary small">
        {% if user.is_authenticated %}{{ user.username }}{% endif %}
      </div>
    </div>
  </nav>

  <form action="{% url 'staff:logout' %}" method="post" style="display:inline;">
  {% csrf_token %}
  <button type="submit">ログアウト</button>
  </form>


  <main class="container py-3">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mb-2">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
