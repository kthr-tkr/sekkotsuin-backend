<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CareFrow Owner Console{% endblock %}</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--line:#dfe8f2;--navy:#0f172a;--blue:#1d4ed8;--muted:#64748b;--green:#047857;--warn:#b7791f;--danger:#b42323}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
    .owner-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.owner-sidebar{background:linear-gradient(180deg,#0f172a,#17345f);color:#fff;padding:22px;display:flex;flex-direction:column;gap:20px}
    .brand{font-size:18px;font-weight:950;letter-spacing:.02em}.brand small{display:block;margin-top:5px;color:#b9c7dc;font-size:12px}.nav{display:grid;gap:8px}.nav a{padding:11px 12px;border-radius:12px;color:#dce7f7;text-decoration:none;font-weight:800}.nav a.active,.nav a:hover{background:rgba(255,255,255,.13);color:#fff}
    .owner-main{padding:28px;display:flex;flex-direction:column;gap:20px}.owner-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;padding:22px 24px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(circle at top left,rgba(37,99,235,.16),transparent 38%),linear-gradient(135deg,#fff,#f7fbff);box-shadow:0 18px 42px rgba(15,23,42,.06)}
    .eyebrow{color:#2563eb;font-size:12px;font-weight:950;letter-spacing:.08em}.owner-header h1{margin:6px 0 0;font-size:32px;line-height:1.12;color:#0f172a}.owner-header p{margin:8px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:0 13px;border:1px solid #cbd7e6;border-radius:12px;background:#fff;color:#1e3a5f;text-decoration:none;font-weight:900;cursor:pointer}.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.btn.warn{background:#fff8e8;border-color:#eed39b;color:#8a5a00}
    .messages{position:fixed;top:16px;right:16px;z-index:20;display:grid;gap:8px;max-width:420px}.message{padding:12px 14px;border:1px solid #cfe0f4;border-radius:14px;background:#fff;box-shadow:0 14px 34px rgba(15,23,42,.12);font-weight:800;font-size:13px}.message.success{border-color:#b9e5cd;background:#f5fcf8}.message.error{border-color:#f0c6c6;background:#fff7f7;color:#9a2424}
    .grid{display:grid;gap:14px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{padding:20px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 13px 32px rgba(15,23,42,.05)}.card h2{margin:0 0 12px;font-size:20px}.muted{color:var(--muted);font-size:13px}.metric-label{color:var(--muted);font-size:12px;font-weight:900}.metric-value{margin-top:7px;color:#12335f;font-size:30px;font-weight:950;letter-spacing:-.04em}.table-wrap{overflow-x:auto}.owner-table{width:100%;border-collapse:collapse;min-width:900px}.owner-table th{padding:11px;background:#f8fafc;color:#64748b;font-size:12px;text-align:left}.owner-table td{padding:13px 11px;border-top:1px solid #edf2f7;font-size:13px;vertical-align:middle}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eaf2ff;color:#1d4ed8;font-size:11px;font-weight:900}.pill.green{background:#e8f8ef;color:#047857}.pill.warn{background:#fff2cf;color:#946200}
    .form-card{max-width:980px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:900;color:#415674}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #cbd7e6;border-radius:12px;background:#fbfdff;font:inherit}.field ul{margin:0;padding-left:18px;color:#b42323;font-size:12px}.check-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.check-list label{padding:9px 10px;border:1px solid #dbe5ef;border-radius:12px;background:#f8fafc}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.notice{padding:14px 16px;border:1px solid #f0d59d;border-radius:16px;background:#fff9ed;color:#755312;font-size:13px;line-height:1.7}
    @media(max-width:900px){.owner-shell{grid-template-columns:1fr}.owner-sidebar{position:static}.owner-header{flex-direction:column;align-items:flex-start}.grid.cols-4,.grid.cols-3,.grid.cols-2,.field-grid{grid-template-columns:1fr}.check-list{grid-template-columns:1fr 1fr}.owner-main{padding:18px}}
  </style>
</head>
<body>
{% if messages %}
  <div class="messages" aria-live="polite">
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
  </div>
{% endif %}
<div class="owner-shell">
  <aside class="owner-sidebar">
    <div class="brand">CareFrow<br>Owner Console<small>全院管理</small></div>
    <nav class="nav">
      <a href="{% url 'owner_admin:dashboard' %}" class="{% if active == 'dashboard' %}active{% endif %}">ダッシュボード</a>
      <a href="{% url 'owner_admin:clinic_list' %}" class="{% if active == 'clinics' %}active{% endif %}">院一覧</a>
      <a href="{% url 'staff:dashboard' %}">staff画面へ</a>
    </nav>
  </aside>
  <main class="owner-main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
