{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:720px;margin:0 auto;padding:28px 18px;">
  <h1 style="font-size:22px;font-weight:900;margin:0;">問診入力</h1>
  <p style="color:var(--muted);margin-top:6px;">
    予約：{{ appointment.start_at|date:"Y/m/d H:i" }}（{{ appointment.menu }}）
  </p>

  <form method="post" style="margin-top:18px;display:grid;gap:12px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn primary" type="submit">問診を送信</button>
  </form>

  <div style="margin-top:14px;">
    <a class="btn ghost" href="{% url 'appointments:book_complete' appointment.id %}">予約完了へ戻る</a>
  </div>
</div>
{% endblock %}
