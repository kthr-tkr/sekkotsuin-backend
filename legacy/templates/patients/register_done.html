{% extends "base.html" %}
{% block content %}
<div style="max-width:720px;margin:0 auto;padding:28px 18px;">
  <div style="border:1px solid var(--line);background:#fff;border-radius:20px;padding:22px;">
    <h1 style="font-size:22px;font-weight:900;margin:0;">登録が完了しました 🎉</h1>
    <p style="color:var(--muted);margin-top:8px;">
      次回以降のログインに使えます。スクショ推奨です。
    </p>

    <div style="margin-top:14px;border:1px dashed var(--line);border-radius:16px;padding:16px;background:rgba(120,94,240,.04);">
      <div style="font-size:12px;color:var(--muted);font-weight:800;">あなたの診察券番号</div>
      <div id="cardNo" style="font-size:28px;font-weight:900;letter-spacing:.06em;margin-top:6px;">
        {{ patient.card_no }}
      </div>
      <button class="btn" type="button" style="margin-top:12px;" onclick="copyCardNo()">診察券番号をコピー</button>
    </div>

    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <a class="btn primary" href="{% url 'patients:login' %}">ログインへ</a>
      <a class="btn ghost" href="/">トップへ</a>
    </div>
  </div>
</div>

<script>
function copyCardNo(){
  const text = document.getElementById("cardNo").innerText.trim();
  navigator.clipboard.writeText(text);
  alert("診察券番号をコピーしました: " + text);
}
</script>
{% endblock %}
