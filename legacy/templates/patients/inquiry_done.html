<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>お問い合わせ送信完了</title>
  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e5e7eb;
      --primary:#0b1a33; --primary2:#112a52; --success:#16a34a;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
    .card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(2,6,23,.06);padding:36px 30px;text-align:center;}
    .icon{width:72px;height:72px;margin:0 auto 20px;border-radius:999px;background:#f0fdf4;border:1px solid #bbf7d0;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--success);font-weight:900;}
    .title{font-size:30px;font-weight:900;margin:0;}
    .subtitle{margin:14px 0 0;color:var(--muted);font-size:15px;line-height:1.9;}
    .actions{margin-top:24px;display:flex;justify-content:center;}
    .btn{min-width:220px;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:14px 18px;font-weight:800;font-size:14px;background:linear-gradient(180deg,var(--primary2),var(--primary));color:#fff;text-decoration:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">✓</div>
      <h1 class="title">お問い合わせを送信しました</h1>
      <p class="subtitle">
        内容を受け付けました。<br>
        確認のうえ、順次ご返信いたします。
      </p>
      <div class="actions">
        <a class="btn" href="{% url 'patients:dashboard' %}">ホームへ戻る</a>
      </div>
    </div>
  </div>
</body>
</html>
